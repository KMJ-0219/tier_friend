<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIEND ANALYSIS — 인간관계 분석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#13151b; --bg2:#181b23; --panel:#1e2230; --panel2:#252a3a; --line:#2e3447;
  --text:#e8eaf2; --muted:#8d93a8; --accent:#6366f1; --accent2:#818cf8; --danger:#ef5d5d;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --star:#e8b341;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#333a50;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

header{display:flex;align-items:center;gap:14px;padding:0 22px;height:58px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;overflow-x:auto}
.logo{font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.logo b{color:var(--accent2);font-family:var(--mono)}
nav{display:flex;gap:4px;margin-left:8px}
.tab-btn{padding:8px 13px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;transition:.15s}
.tab-btn:hover{color:var(--text);background:var(--panel)}
.tab-btn.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.hd-right{margin-left:auto;display:flex;gap:8px;align-items:center;white-space:nowrap}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#666;transition:.3s}
.conn-dot.ok{background:#4ade80;box-shadow:0 0 8px #4ade8088}
.conn-dot.bad{background:var(--danger)}
.conn-label{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#48506e;background:#2b3146}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.danger{color:#ffb4b4;border-color:#5a3340}
.btn.danger:hover{background:#3a2030;border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.tab-page{display:none;padding:20px 22px;max-width:1400px;margin:0 auto}
.tab-page.on{display:block}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:18px;font-weight:800}
.page-head .count{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.page-head .spacer{flex:1}
.empty-note{color:var(--muted);text-align:center;padding:50px 0;font-size:13.5px;line-height:1.8}
.search-input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;outline:none;font-size:13px;min-width:150px;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
select.search-input{cursor:pointer}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-pop-wrap{position:relative}
.filter-pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;width:260px;box-shadow:0 12px 32px #000a;z-index:40;display:none;max-height:340px;overflow-y:auto}
.filter-pop.on{display:block}
.filter-sec{margin-bottom:10px}
.filter-sec:last-child{margin-bottom:0}
.filter-sec .lbl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.filter-chip-row{display:flex;flex-wrap:wrap;gap:5px}
.filter-chip{font-size:12px;padding:4px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.13s}
.filter-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toggle-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.toggle-chip.on{color:var(--star);border-color:#5a4a2a;background:#2a2415}

/* friend cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard2{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;gap:8px}
.fcard2:hover{border-color:#48506e;transform:translateY(-1px)}
.fcard2 .top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.fcard2 .nm{font-weight:800;font-size:14.5px}
.fcard2 .cat{font-size:11.5px;color:var(--muted)}
.fav-btn{position:absolute;top:10px;right:10px;font-size:15px;color:#454c66;transition:.13s}
.fav-btn.on{color:var(--star)}
.stars{font-size:12px;color:var(--star);letter-spacing:1px}
.stars .off{color:#3a3f52}
.fcard2 .tagrow{display:flex;flex-wrap:wrap;gap:4px}
.mini-tag{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}

/* generic item cards (mgmt pages) */
.item-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:7px}
.item-card:hover{border-color:#444c6c}
.item-card .top{display:flex;align-items:flex-start;gap:8px}
.item-card h3{font-size:14.5px;font-weight:800;flex:1;line-height:1.35;display:flex;align-items:center;gap:8px}
.item-card .desc{font-size:12.5px;color:#c6cad8;line-height:1.5}
.icon-btn{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;font-size:13px}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.icon-btn.del:hover{color:var(--danger);border-color:#5a3340}
.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid #0004}
.tag-type-block{margin-bottom:22px}
.tag-type-block h3{font-size:14px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}

/* modals */
.overlay{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:600px;padding:22px 22px 20px;animation:pop .18s ease;box-shadow:0 20px 60px #000a}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.modal h2 .x{margin-left:auto}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px;line-height:1.5}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.color-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.color-sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.color-sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal-foot .left{margin-right:auto}
.pick-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:150px;overflow-y:auto;padding:6px}
.pick-row{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.pick-row:hover{background:var(--panel2)}
.pick-row input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.inline-new{display:flex;gap:6px;margin-top:7px}
.inline-new input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;font-size:12.5px}
.star-pick{display:flex;gap:4px;font-size:22px;color:#3a3f52;cursor:pointer}
.star-pick span.on{color:var(--star)}
.rel-row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.rel-row .rr-top{display:flex;gap:8px;margin-bottom:8px}
.rel-row select,.rel-row input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px}
.rel-row .rr-del{margin-left:auto}

/* detail modal */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.detail-head h2{margin:0;font-size:19px}
.detail-sec{margin-bottom:14px}
.detail-sec .sec-label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}
.detail-sec p{font-size:13.5px;line-height:1.65;color:#d4d8e4;white-space:pre-wrap}
.detail-sec p.dim{color:var(--muted);font-size:12.5px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line)}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent);color:#fff}
.rel-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.rel-chip:hover{border-color:var(--accent)}
.rel-chip .rt{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:20px}

/* viz */
#vizWrap{border:1px solid var(--line);border-radius:14px;background:var(--bg2);position:relative;overflow:hidden}
#vizSvg{width:100%;display:block;cursor:grab}
#vizSvg:active{cursor:grabbing}
.viz-legend{position:absolute;top:12px;left:12px;background:#181b23dd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;max-width:220px}
.viz-legend .lg-sec{margin-bottom:6px}
.viz-legend .lg-title{font-weight:800;color:var(--muted);margin-bottom:4px;font-size:10.5px;letter-spacing:.05em}
.viz-legend .lg-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.node-label{font-size:11px;font-weight:700;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:#13151b;stroke-width:3px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 24px #000a}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--danger);color:#ffc2c2}

@media (pointer:coarse){
  .icon-btn{width:36px;height:36px;font-size:15px}
  .search-input{font-size:16px;padding:10px 13px}
  .btn{padding:11px 17px;font-size:13.5px}
  .field input[type=text],.field input[type=number],.field textarea,.field select,.inline-new input{font-size:16px}
  .color-sw{width:32px;height:32px}
}
@media(max-width:700px){
  header{padding:0 12px}
  .tab-page{padding:14px 12px 26px}
  .grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo">FRIEND<b>::</b>ANALYSIS</div>
  <nav>
    <button class="tab-btn on" data-tab="main">메인</button>
    <button class="tab-btn" data-tab="viz">인간관계 시각화</button>
    <button class="tab-btn" data-tab="tags">태그 관리</button>
    <button class="tab-btn" data-tab="groups">무리 관리</button>
    <button class="tab-btn" data-tab="reltypes">관계유형 관리</button>
  </nav>
  <div class="hd-right">
    <span class="conn-dot" id="connDot"></span>
    <span class="conn-label" id="connLabel">connecting…</span>
  </div>
</header>

<!-- ===== 메인 ===== -->
<section class="tab-page on" id="page-main">
  <div class="page-head">
    <h2>친구</h2><span class="count" id="mainCount">0</span>
    <div class="spacer"></div>
    <button class="btn primary" id="btnAddFriend">＋ 친구 추가</button>
  </div>
  <div class="toolbar">
    <input type="text" class="search-input" id="qSearch" placeholder="이름 검색" style="flex:1;min-width:160px">
    <select class="search-input" id="qCategory"><option value="">분류: 전체</option></select>
    <div class="filter-pop-wrap">
      <button class="btn" id="btnTagFilter">태그 필터<span id="tagFilterBadge"></span></button>
      <div class="filter-pop" id="tagFilterPop"></div>
    </div>
    <button class="toggle-chip" id="btnFavFilter">★ 즐겨찾기만</button>
    <select class="search-input" id="qSort">
      <option value="rating_desc">평점 높은순</option>
      <option value="rating_asc">평점 낮은순</option>
      <option value="name">이름순</option>
      <option value="recent">최근 수정순</option>
    </select>
  </div>
  <div class="grid" id="mainList"></div>
</section>

<!-- ===== 시각화 ===== -->
<section class="tab-page" id="page-viz">
  <div class="page-head">
    <h2>인간관계 시각화</h2>
    <div class="spacer"></div>
    <span style="font-size:12px;color:var(--muted)">노드 드래그로 위치 조정 · 클릭 시 상세보기 · 휠로 확대/축소</span>
  </div>
  <div id="vizWrap">
    <svg id="vizSvg" height="640"></svg>
    <div class="viz-legend" id="vizLegend"></div>
  </div>
</section>

<!-- ===== 태그 관리 ===== -->
<section class="tab-page" id="page-tags">
  <div class="page-head">
    <h2>태그 관리</h2>
    <div class="spacer"></div>
    <input type="text" class="search-input" id="tagSearch" placeholder="태그 검색">
  </div>
  <div id="tagTypeBlocks"></div>
</section>

<!-- ===== 무리 관리 ===== -->
<section class="tab-page" id="page-groups">
  <div class="page-head">
    <h2>무리</h2><span class="count" id="groupCount">0</span>
    <div class="spacer"></div>
    <input type="text" class="search-input" id="groupSearch" placeholder="무리 검색">
    <button class="btn primary" id="btnAddGroup">＋ 무리 추가</button>
  </div>
  <div class="grid" id="groupList"></div>
</section>

<!-- ===== 관계유형 관리 ===== -->
<section class="tab-page" id="page-reltypes">
  <div class="page-head">
    <h2>관계유형</h2><span class="count" id="relTypeCount">0</span>
    <div class="spacer"></div>
    <button class="btn primary" id="btnAddRelType">＋ 관계유형 추가</button>
  </div>
  <div class="grid" id="relTypeList"></div>
</section>

<!-- ===== 친구 편집 모달 ===== -->
<div class="overlay" id="ovFriend">
  <div class="modal" style="max-width:640px">
    <h2 id="frTitle">친구 추가 <button class="icon-btn x" data-close="ovFriend">✕</button></h2>

    <div class="field-row">
      <div class="field" style="flex:2">
        <label>이름</label>
        <input type="text" id="frName" placeholder="이름">
      </div>
      <div class="field">
        <label>분류</label>
        <select id="frCategory"><option value="">선택 안 함</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>아바타 이모지</label>
        <input type="text" id="frEmoji" placeholder="🙂 (비우면 분류 기본값)">
      </div>
      <div class="field" style="flex:2">
        <label>아바타 이미지 URL (선택)</label>
        <input type="text" id="frImg" placeholder="https://...">
      </div>
    </div>

    <div class="field">
      <label>본문</label>
      <textarea id="frDesc" placeholder="이 친구에 대한 소개"></textarea>
    </div>

    <div id="frTagPickers"></div>

    <div class="field">
      <label>무리</label>
      <div class="pick-box" id="frGroupPick"></div>
    </div>

    <div class="field">
      <label>인간관계</label>
      <div id="frRelList"></div>
      <button class="btn sm" id="frAddRel">＋ 관계 추가</button>
    </div>

    <div class="field">
      <label>관계(글)</label>
      <textarea id="frRelNote" placeholder="관계에 대한 자유 서술"></textarea>
    </div>
    <div class="field">
      <label>기타사항</label>
      <textarea id="frEtc"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label>별점</label>
        <div class="star-pick" id="frStars"></div>
      </div>
      <div class="field">
        <label>즐겨찾기</label>
        <button class="toggle-chip" id="frFavToggle" style="margin-top:2px">★ 즐겨찾기</button>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn" data-close="ovFriend">취소</button>
      <button class="btn primary" id="frSave">저장</button>
    </div>
  </div>
</div>

<!-- ===== 친구 상세 모달 ===== -->
<div class="overlay" id="ovDetail">
  <div class="modal">
    <div class="detail-head">
      <div class="avatar" id="dAvatar" style="width:46px;height:46px;font-size:22px"></div>
      <h2 id="dName"></h2>
      <span class="stars" id="dStars"></span>
      <button class="icon-btn x" data-close="ovDetail" style="margin-left:auto">✕</button>
    </div>
    <div class="detail-sec" id="dCatSec">
      <div class="sec-label">분류</div>
      <p id="dCat"></p>
    </div>
    <div class="detail-sec">
      <div class="sec-label">본문</div>
      <p id="dDesc"></p>
    </div>
    <div class="detail-sec"><div class="sec-label" id="dTagLabel-특징"></div><div class="chip-row" id="dTags-특징"></div></div>
    <div class="detail-sec"><div class="sec-label" id="dTagLabel-관심분야"></div><div class="chip-row" id="dTags-관심분야"></div></div>
    <div class="detail-sec"><div class="sec-label" id="dTagLabel-성격"></div><div class="chip-row" id="dTags-성격"></div></div>
    <div class="detail-sec"><div class="sec-label" id="dTagLabel-키워드"></div><div class="chip-row" id="dTags-키워드"></div></div>
    <div class="detail-sec">
      <div class="sec-label">무리</div>
      <div class="chip-row" id="dGroups"></div>
    </div>
    <div class="detail-sec">
      <div class="sec-label">인간관계</div>
      <div id="dRels" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="detail-sec" id="dRelNoteSec">
      <div class="sec-label">관계(글)</div>
      <p id="dRelNote"></p>
    </div>
    <div class="detail-sec" id="dEtcSec">
      <div class="sec-label">기타사항</div>
      <p class="dim" id="dEtc"></p>
    </div>
    <div class="modal-foot">
      <button class="btn danger left" id="dDelete">삭제</button>
      <button class="btn" data-close="ovDetail">닫기</button>
      <button class="btn primary" id="dEdit">수정</button>
    </div>
  </div>
</div>

<!-- ===== 태그 추가/수정 모달 ===== -->
<div class="overlay" id="ovTag">

      <label>이름</label>
      <input type="text" id="tagName" placeholder="예: 눈치빠름">

      <label>기본 이모지 (이 분류를 가진 친구의 기본 아바타)</label>

    </div>
    <div class="modal-foot">
      <button class="btn" data-close="ovTag">취소</button>
      <button class="btn primary" id="tagSave">저장</button>
    </div>
  </div>
</div>

<!-- ===== 무리 추가/수정 모달 ===== -->
<div class="overlay" id="ovGroup">
  <div class="modal">
    <h2 id="groupModalTitle">무리 추가 <button class="icon-btn x" data-close="ovGroup">✕</button></h2>
    <div class="field">
      <label>이름</label>
      <input type="text" id="groupName" placeholder="예: 동아리 친구들">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="color-row" id="groupColors"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="ovGroup">취소</button>
      <button class="btn primary" id="groupSave">저장</button>
    </div>
  </div>
</div>

<!-- ===== 관계유형 추가/수정 모달 ===== -->
<div class="overlay" id="ovRelType">
  <div class="modal">
    <h2 id="relTypeModalTitle">관계유형 추가 <button class="icon-btn x" data-close="ovRelType">✕</button></h2>
    <div class="field">
      <label>이름</label>
      <input type="text" id="relTypeName" placeholder="예: 절친">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="color-row" id="relTypeColors"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="ovRelType">취소</button>
      <button class="btn primary" id="relTypeSave">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
/* =====================================================
   SUPABASE
===================================================== */
const SUPABASE_URL = 'https://hlvpffypajsoythbfrvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lGroGfmZE91oueKBLlgerQ_Ja8Fwhmz';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ['#6366f1','#e8b341','#4ade80','#60a5fa','#c084fc','#f472b6','#fb923c','#2dd4bf','#94a3b8','#e06c6c'];
const NON_CATEGORY_ORDER = ['특징','관심분야','성격','키워드'];

const S = {
  tagTypes: [],      // [{id,name,tags:[{id,label,default_emoji}]}]
  groups: [],
  relTypes: [],
  friends: [],        // enriched: {..., tagsByType:{name:[tag,...]}, category, groups:[...], relOut:[...], relIn:[...]}
  editingFriendId: null,
  pickedTags: {},     // tagTypeName -> Set(tagId)
  pickedGroups: new Set(),
  relDraft: [],        // [{related_friend_id, relationship_type_id, detail, strength, _existingId}]
  favToggle: false,
  tagFilter: new Set(), // selected tag ids across non-category types
  starVal: 0,
  favVal: false,
  detailFriendId: null,
  editingTag: null,   // {typeName, typeId, row}
  editingGroup: null,
  editingRelType: null,
  groupColor: COLORS[0],
  relTypeColor: COLORS[0],
};

const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg, err=false){
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'on err' : 'on';
  clearTimeout(t._tm); t._tm = setTimeout(()=> t.className='', 2200);
}
function openOv(id){ $('#'+id).classList.add('on'); }
function closeOv(id){ $('#'+id).classList.remove('on'); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeOv(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('mousedown', e => { if(e.target === ov) ov.classList.remove('on'); }));
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('on', p.id === 'page-' + b.dataset.tab));
  try{ localStorage.setItem('fa_last_tab', b.dataset.tab); }catch(e){}
  if(b.dataset.tab === 'viz') renderViz();
}));

/* =====================================================
   DATA LOAD
===================================================== */
async function loadAll(){
  try{
    const [tt, gr, rt, fr, relRes] = await Promise.all([
      sb.from('tag_types').select('*, tags(*)').order('name'),
      sb.from('groups').select('*').order('name'),
      sb.from('relationship_types').select('*').order('label'),
      sb.from('friends').select(`
        *,
        category:tags!category_tag_id(*),
        friend_tags(tags(*, tag_types(id,name))),
        friend_groups(groups(*))
      `).order('name'),
      sb.from('friend_relationships').select(`
        *,
        type:relationship_types(*),
        from:friends!friend_id(id,name,avatar_emoji,avatar_image_url),
        to:friends!related_friend_id(id,name,avatar_emoji,avatar_image_url)
      `),
    ]);
    for(const r of [tt, gr, rt, fr, relRes]) if(r.error) throw r.error;

    S.tagTypes = (tt.data || []).map(t => ({...t, tags: (t.tags||[]).filter(x=>!x.is_deleted).sort((a,b)=>a.label.localeCompare(b.label))}));
    S.groups = gr.data || [];
    S.relTypes = rt.data || [];

    const relations = relRes.data || [];
    S.friends = (fr.data || []).map(p => {
      const tagsByType = {};
      for(const link of (p.friend_tags||[])){
        const tg = link.tags; if(!tg) continue;
        const tn = tg.tag_types?.name; if(!tn) continue;
        (tagsByType[tn] = tagsByType[tn] || []).push(tg);
      }
      return {
        ...p,
        tagsByType,
        groups: (p.friend_groups||[]).map(l => l.groups).filter(Boolean),
        relOut: relations.filter(r => r.friend_id === p.id),
        relIn: relations.filter(r => r.related_friend_id === p.id),
      };
    });
    setConn(true);
    renderAll();
  }catch(e){
    console.error(e);
    setConn(false);
    toast('데이터 로드 실패: ' + (e.message || e), true);
  }
}
function setConn(ok){
  $('#connDot').className = 'conn-dot ' + (ok ? 'ok' : 'bad');
  $('#connLabel').textContent = ok ? 'supabase 연결됨' : '연결 오류';
}
function tagTypeByName(name){ return S.tagTypes.find(t => t.name === name); }
function friendById(id){ return S.friends.find(f => f.id === id); }

let rtTm = null;
sb.channel('friend_analysis_rt').on('postgres_changes', {event:'*', schema:'public'}, () => {
  clearTimeout(rtTm); rtTm = setTimeout(loadAll, 400);
}).subscribe();

function renderAll(){
  renderCategoryFilterOptions();
  renderTagFilterPop();
  renderMain();
  renderTagsPage();
  renderGroupsPage();
  renderRelTypesPage();
  if($('#page-viz').classList.contains('on')) renderViz();
}

/* =====================================================
   메인 페이지
===================================================== */
function renderCategoryFilterOptions(){
  const cat = tagTypeByName('분류');
  const sel = $('#qCategory');
  const cur = sel.value;
  sel.innerHTML = '<option value="">분류: 전체</option>' + (cat ? cat.tags.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join('') : '');
  sel.value = cur;
}
function renderTagFilterPop(){
  const pop = $('#tagFilterPop');
  pop.innerHTML = NON_CATEGORY_ORDER.map(tn => {
    const tt = tagTypeByName(tn);
    if(!tt || !tt.tags.length) return '';
    return `<div class="filter-sec"><div class="lbl">${esc(tn)}</div><div class="filter-chip-row">
      ${tt.tags.map(t => `<button class="filter-chip ${S.tagFilter.has(t.id)?'on':''}" data-tid="${t.id}">${esc(t.label)}</button>`).join('')}
    </div></div>`;
  }).join('') || '<div style="color:var(--muted);font-size:12.5px">등록된 태그가 없습니다.</div>';
  pop.querySelectorAll('.filter-chip').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.tid;
    S.tagFilter.has(id) ? S.tagFilter.delete(id) : S.tagFilter.add(id);
    renderTagFilterPop();
    renderMain();
  }));
  $('#tagFilterBadge').textContent = S.tagFilter.size ? ` (${S.tagFilter.size})` : '';
}
$('#btnTagFilter').addEventListener('click', () => $('#tagFilterPop').classList.toggle('on'));
document.addEventListener('click', e => {
  if(!e.target.closest('.filter-pop-wrap')) $('#tagFilterPop').classList.remove('on');
});
$('#btnFavFilter').addEventListener('click', () => { S.favToggle = !S.favToggle; $('#btnFavFilter').classList.toggle('on', S.favToggle); renderMain(); });
$('#qSearch').addEventListener('input', renderMain);
$('#qCategory').addEventListener('change', renderMain);
$('#qSort').addEventListener('change', renderMain);

function starsHtml(rating, size){
  let h = '';
  for(let i=1;i<=5;i++) h += `<span class="${i<=rating?'':'off'}">★</span>`;
  return h;
}
function renderMain(){
  const q = $('#qSearch').value.trim().toLowerCase();
  const catId = $('#qCategory').value;
  let rows = S.friends.filter(f => {
    if(q && !f.name.toLowerCase().includes(q)) return false;
    if(catId && f.category_tag_id !== catId) return false;
    if(S.favToggle && !f.favorite) return false;
    if(S.tagFilter.size){
      const allTagIds = new Set(Object.values(f.tagsByType).flat().map(t=>t.id));
      for(const id of S.tagFilter) if(!allTagIds.has(id)) return false;
    }
    return true;
  });
  const sort = $('#qSort').value;
  rows = rows.slice().sort((a,b) => {
    if(sort==='rating_desc') return (b.rating||0)-(a.rating||0);
    if(sort==='rating_asc') return (a.rating||0)-(b.rating||0);
    if(sort==='name') return a.name.localeCompare(b.name);
    if(sort==='recent') return new Date(b.updated_at||b.created_at) - new Date(a.updated_at||a.created_at);
    return 0;
  });
  $('#mainCount').textContent = rows.length + (rows.length!==S.friends.length ? ' / '+S.friends.length : '');
  $('#mainList').innerHTML = rows.length ? rows.map(f => {
    const tagPreview = NON_CATEGORY_ORDER.flatMap(tn => f.tagsByType[tn]||[]).slice(0,3);
    return `<div class="fcard2" onclick="openDetail('${f.id}')">
      <button class="fav-btn ${f.favorite?'on':''}" onclick="event.stopPropagation();toggleFav('${f.id}')">★</button>
      <div class="top">
        <div class="avatar">${f.avatar_image_url ? `<img src="${esc(f.avatar_image_url)}">` : esc(f.avatar_emoji||'🙂')}</div>
        <div>
          <div class="nm">${esc(f.name)}</div>
          <div class="cat">${f.category ? esc(f.category.label) : '분류 없음'}</div>
        </div>
      </div>
      <div class="stars">${starsHtml(f.rating||0)}</div>
      ${tagPreview.length ? `<div class="tagrow">${tagPreview.map(t=>`<span class="mini-tag">${esc(t.label)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-note" style="grid-column:1/-1">${S.friends.length? '조건에 맞는 친구가 없습니다.':'아직 등록된 친구가 없습니다. 「＋ 친구 추가」로 시작하세요.'}</div>`;
}
window.toggleFav = async (id) => {
  const f = friendById(id); if(!f) return;
  const { error } = await sb.from('friends').update({favorite: !f.favorite}).eq('id', id);
  if(error) return toast('실패: '+error.message, true);
  f.favorite = !f.favorite;
  renderMain();
};

/* =====================================================
   친구 편집 모달
===================================================== */
function renderFrCategorySelect(selId){
  const cat = tagTypeByName('분류');
  const sel = $('#frCategory');
  sel.innerHTML = '<option value="">선택 안 함</option>' + (cat ? cat.tags.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('') : '');
  sel.value = selId || '';
}
function renderFrTagPickers(){
  const wrap = $('#frTagPickers');
  wrap.innerHTML = NON_CATEGORY_ORDER.map(tn => {
    const tt = tagTypeByName(tn);
    const tagId = tt?.id;
    const items = tt ? tt.tags : [];
    return `<div class="field">
      <label>${esc(tn)}</label>
      <div class="pick-box" data-typename="${esc(tn)}">
        ${items.length ? items.map(t => `<label class="pick-row"><input type="checkbox" data-tid="${t.id}" data-typename="${esc(tn)}" ${S.pickedTags[tn]?.has(t.id)?'checked':''}><b>${esc(t.label)}</b></label>`).join('')
          : `<div style="padding:8px;color:var(--muted);font-size:12px">아직 없음</div>`}
      </div>
      <div class="inline-new">
        <input type="text" placeholder="새 ${esc(tn)} 추가" data-newfor="${esc(tn)}">
        <button class="btn sm" data-addfor="${esc(tn)}">추가</button>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('input[type=checkbox]').forEach(ch => ch.addEventListener('change', () => {
    const tn = ch.dataset.typename;
    S.pickedTags[tn] = S.pickedTags[tn] || new Set();
    ch.checked ? S.pickedTags[tn].add(ch.dataset.tid) : S.pickedTags[tn].delete(ch.dataset.tid);
  }));
  wrap.querySelectorAll('[data-addfor]').forEach(btn => btn.addEventListener('click', async () => {
    const tn = btn.dataset.addfor;
    const inp = wrap.querySelector(`input[data-newfor="${tn}"]`);
    const label = inp.value.trim();
    if(!label) return;
    let tt = tagTypeByName(tn);
    if(!tt){ toast('태그 유형이 없습니다: '+tn, true); return; }
    const { data, error } = await sb.from('tags').insert({tag_type_id: tt.id, label}).select().single();
    if(error) return toast('추가 실패: '+error.message, true);
    tt.tags.push(data); tt.tags.sort((a,b)=>a.label.localeCompare(b.label));
    S.pickedTags[tn] = S.pickedTags[tn] || new Set(); S.pickedTags[tn].add(data.id);
    inp.value = '';
    renderFrTagPickers();
    toast('추가 및 선택됨');
  }));
}
function renderFrGroupPick(){
  const box = $('#frGroupPick');
  box.innerHTML = S.groups.length ? S.groups.map(g => `
    <label class="pick-row"><input type="checkbox" data-gid="${g.id}" ${S.pickedGroups.has(g.id)?'checked':''}>
      <span class="color-dot" style="background:${esc(g.color||'#666')}"></span><b>${esc(g.name)}</b></label>`).join('')
    : `<div style="padding:8px;color:var(--muted);font-size:12px">등록된 무리가 없습니다. 「무리 관리」 탭에서 추가하세요.</div>`;
  box.querySelectorAll('input').forEach(ch => ch.addEventListener('change', () => {
    ch.checked ? S.pickedGroups.add(ch.dataset.gid) : S.pickedGroups.delete(ch.dataset.gid);
  }));
}
function renderFrStars(){
  const box = $('#frStars');
  box.innerHTML = [1,2,3,4,5].map(i => `<span class="${i<=S.starVal?'on':''}" data-v="${i}">★</span>`).join('');
  box.querySelectorAll('span').forEach(sp => sp.addEventListener('click', () => {
    S.starVal = (S.starVal === Number(sp.dataset.v)) ? Number(sp.dataset.v)-1 : Number(sp.dataset.v);
    renderFrStars();
  }));
}
function relTypeOptionsHtml(sel){
  return S.relTypes.map(t => `<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.label)}</option>`).join('');
}
function friendOptionsHtml(excludeId, sel){
  return S.friends.filter(f=>f.id!==excludeId).map(f => `<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.name)}</option>`).join('');
}
function renderFrRelList(){
  const wrap = $('#frRelList');
  const excludeId = S.editingFriendId;
  wrap.innerHTML = S.relDraft.map((r, idx) => `
    <div class="rel-row" data-idx="${idx}">
      <div class="rr-top">
        <select data-f="friend">${friendOptionsHtml(excludeId, r.related_friend_id)}</select>
        <select data-f="type">${relTypeOptionsHtml(r.relationship_type_id)}</select>
        <button class="icon-btn del rr-del" data-f="del">🗑</button>
      </div>
      <div class="rr-top">
        <input type="text" data-f="detail" placeholder="관계 설명" value="${esc(r.detail||'')}" style="flex:1">
        <input type="number" data-f="strength" min="1" max="5" value="${r.strength||3}" style="width:56px" title="강도(1-5)">
      </div>
    </div>`).join('') || `<div style="color:var(--muted);font-size:12.5px;padding:6px 0">등록된 관계가 없습니다.</div>`;
  wrap.querySelectorAll('.rel-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('[data-f=friend]').addEventListener('change', e => S.relDraft[idx].related_friend_id = e.target.value);
    row.querySelector('[data-f=type]').addEventListener('change', e => S.relDraft[idx].relationship_type_id = e.target.value);
    row.querySelector('[data-f=detail]').addEventListener('input', e => S.relDraft[idx].detail = e.target.value);
    row.querySelector('[data-f=strength]').addEventListener('input', e => S.relDraft[idx].strength = Number(e.target.value)||3);
    row.querySelector('[data-f=del]').addEventListener('click', () => { S.relDraft.splice(idx,1); renderFrRelList(); });
  });
}
$('#frAddRel').addEventListener('click', () => {
  if(S.friends.filter(f=>f.id!==S.editingFriendId).length === 0){ toast('다른 친구를 먼저 추가하세요', true); return; }
  if(S.relTypes.length === 0){ toast('관계유형을 먼저 추가하세요', true); return; }
  S.relDraft.push({related_friend_id: S.friends.find(f=>f.id!==S.editingFriendId).id, relationship_type_id: S.relTypes[0].id, detail:'', strength:3});
  renderFrRelList();
});
$('#frFavToggle').addEventListener('click', () => { S.favVal = !S.favVal; $('#frFavToggle').classList.toggle('on', S.favVal); });

function openFriendModal(f = null){
  S.editingFriendId = f ? f.id : null;
  S.pickedTags = {};
  for(const tn of NON_CATEGORY_ORDER) S.pickedTags[tn] = new Set(f ? (f.tagsByType[tn]||[]).map(t=>t.id) : []);
  S.pickedGroups = new Set(f ? f.groups.map(g=>g.id) : []);
  S.relDraft = f ? f.relOut.map(r => ({related_friend_id:r.related_friend_id, relationship_type_id:r.relationship_type_id, detail:r.detail||'', strength:r.strength||3, _existingId:r.id})) : [];
  S.starVal = f ? (f.rating||0) : 0;
  S.favVal = f ? !!f.favorite : false;

  $('#frTitle').childNodes[0].textContent = f ? `수정: ${f.name} ` : '친구 추가 ';
  $('#frName').value = f?.name || '';
  $('#frEmoji').value = f?.avatar_emoji || '';
  $('#frImg').value = f?.avatar_image_url || '';
  $('#frDesc').value = f?.description || '';
  $('#frRelNote').value = f?.relationship_note || '';
  $('#frEtc').value = f?.etc_note || '';
  $('#frFavToggle').classList.toggle('on', S.favVal);

  renderFrCategorySelect(f?.category_tag_id);
  renderFrTagPickers();
  renderFrGroupPick();
  renderFrStars();
  renderFrRelList();
  openOv('ovFriend');
  $('#frName').focus();
}
$('#btnAddFriend').addEventListener('click', () => openFriendModal());
window.editFriend = id => { closeOv('ovDetail'); openFriendModal(friendById(id)); };
window.delFriend = async id => {
  const f = friendById(id);
  if(!f || !confirm(`'${f.name}' 삭제할까요?`)) return;
  const { error } = await sb.from('friends').delete().eq('id', id);
  if(error) return toast('삭제 실패: '+error.message, true);
  closeOv('ovDetail');
  toast('삭제됨');
  loadAll();
};

$('#frSave').addEventListener('click', async () => {
  const name = $('#frName').value.trim();
  if(!name) return toast('이름을 입력하세요', true);
  const payload = {
    name,
    avatar_emoji: $('#frEmoji').value.trim() || null,
    avatar_image_url: $('#frImg').value.trim() || null,
    category_tag_id: $('#frCategory').value || null,
    description: $('#frDesc').value.trim() || null,
    relationship_note: $('#frRelNote').value.trim() || null,
    etc_note: $('#frEtc').value.trim() || null,
    favorite: S.favVal,
    rating: S.starVal,
  };
  let friendId;
  if(S.editingFriendId){
    const { error } = await sb.from('friends').update(payload).eq('id', S.editingFriendId);
    if(error) return toast('저장 실패: '+error.message, true);
    friendId = S.editingFriendId;
  }else{
    const { data, error } = await sb.from('friends').insert(payload).select().single();
    if(error) return toast('저장 실패: '+error.message, true);
    friendId = data.id;
  }

  const allTagIds = NON_CATEGORY_ORDER.flatMap(tn => [...(S.pickedTags[tn]||[])]);
  await sb.from('friend_tags').delete().eq('friend_id', friendId);
  if(allTagIds.length){
    const { error } = await sb.from('friend_tags').insert(allTagIds.map(tid => ({friend_id: friendId, tag_id: tid})));
    if(error) toast('태그 연결 실패: '+error.message, true);
  }
  await sb.from('friend_groups').delete().eq('friend_id', friendId);
  if(S.pickedGroups.size){
    const { error } = await sb.from('friend_groups').insert([...S.pickedGroups].map(gid => ({friend_id: friendId, group_id: gid})));
    if(error) toast('무리 연결 실패: '+error.message, true);
  }
  await sb.from('friend_relationships').delete().eq('friend_id', friendId);
  const validRel = S.relDraft.filter(r => r.related_friend_id && r.relationship_type_id);
  if(validRel.length){
    const { error } = await sb.from('friend_relationships').insert(validRel.map(r => ({
      friend_id: friendId, related_friend_id: r.related_friend_id, relationship_type_id: r.relationship_type_id,
      detail: r.detail || null, strength: r.strength || 3,
    })));
    if(error) toast('관계 저장 실패: '+error.message, true);
  }

  closeOv('ovFriend');
  toast('저장됨');
  loadAll();
});

window.openDetail = id => {
  const f = friendById(id);
  if(!f) return;
  S.detailFriendId = id;
  $('#dAvatar').innerHTML = f.avatar_image_url ? `<img src="${esc(f.avatar_image_url)}">` : esc(f.avatar_emoji||'🙂');
  $('#dName').textContent = f.name;
  $('#dStars').innerHTML = starsHtml(f.rating||0);
  $('#dCat').textContent = f.category ? f.category.label : '설정 안 됨';
  $('#dDesc').textContent = f.description || '내용 없음';
  for(const tn of NON_CATEGORY_ORDER){
    $('#dTagLabel-'+tn).textContent = tn;
    const items = f.tagsByType[tn]||[];
    $('#dTags-'+tn).innerHTML = items.length ? items.map(t=>`<span class="chip">${esc(t.label)}</span>`).join('') : '<span style="color:var(--muted);font-size:12px">없음</span>';
  }
  $('#dGroups').innerHTML = f.groups.length ? f.groups.map(g=>`<span class="chip" style="border-color:${esc(g.color||'#666')}"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}</span>`).join('') : '<span style="color:var(--muted);font-size:12px">없음</span>';

  const relHtml = [];
  for(const r of f.relOut){
    relHtml.push(`<div class="rel-chip" onclick="openDetail('${r.related_friend_id}')">
      <span class="rt" style="background:${esc(r.type?.color||'#666')}22;color:${esc(r.type?.color||'#ccc')}">${esc(r.type?.label||'?')}</span>
      → ${esc(r.to?.name||'?')} ${r.detail?`· ${esc(r.detail)}`:''} <span style="color:var(--muted);margin-left:auto">강도 ${r.strength||3}</span>
    </div>`);
  }
  for(const r of f.relIn){
    relHtml.push(`<div class="rel-chip" onclick="openDetail('${r.friend_id}')">
      <span class="rt" style="background:${esc(r.type?.color||'#666')}22;color:${esc(r.type?.color||'#ccc')}">${esc(r.type?.label||'?')}</span>
      ← ${esc(r.from?.name||'?')} ${r.detail?`· ${esc(r.detail)}`:''} <span style="color:var(--muted);margin-left:auto">강도 ${r.strength||3}</span>
    </div>`);
  }
  $('#dRels').innerHTML = relHtml.join('') || '<span style="color:var(--muted);font-size:12px">등록된 관계가 없습니다.</span>';

  $('#dRelNoteSec').style.display = f.relationship_note ? '' : 'none';
  $('#dRelNote').textContent = f.relationship_note || '';
  $('#dEtcSec').style.display = f.etc_note ? '' : 'none';
  $('#dEtc').textContent = f.etc_note || '';
  openOv('ovDetail');
};

/* =====================================================
   태그 관리 페이지
===================================================== */
function renderTagsPage(){
  const q = $('#tagSearch').value.trim().toLowerCase();
  $('#tagTypeBlocks').innerHTML = S.tagTypes.map(tt => {
    const rows = q ? tt.tags.filter(t => t.label.toLowerCase().includes(q)) : tt.tags;
    return `<div class="tag-type-block">
      <h3>${esc(tt.name)} <span class="count">${tt.tags.length}</span> <button class="btn sm" data-addtag="${tt.id}" data-typename="${esc(tt.name)}">＋ 추가</button></h3>
      <div class="grid">
        ${rows.length ? rows.map(t => `
          <div class="item-card">
            <div class="top">
              <h3>${tt.name==='분류' ? `<span style="font-size:16px">${esc(t.default_emoji||'🙂')}</span>` : ''}${esc(t.label)}</h3>
              <button class="icon-btn" data-edittag="${t.id}" data-typeid="${tt.id}" data-typename="${esc(tt.name)}">✎</button>
              <button class="icon-btn del" data-deltag="${t.id}">🗑</button>
            </div>
          </div>`).join('') : `<div class="empty-note" style="grid-column:1/-1">${q?'검색 결과 없음':'등록된 태그가 없습니다.'}</div>`}
      </div>
    </div>`;
  }).join('');
  $('#tagTypeBlocks').querySelectorAll('[data-addtag]').forEach(b => b.addEventListener('click', () => openTagModal(b.dataset.typename, b.dataset.addtag, null)));
  $('#tagTypeBlocks').querySelectorAll('[data-edittag]').forEach(b => {
    const tt = S.tagTypes.find(x=>x.id===b.dataset.typeid);
    const row = tt?.tags.find(t=>t.id===b.dataset.edittag);
    b.addEventListener('click', () => openTagModal(b.dataset.typename, b.dataset.typeid, row));
  });
  $('#tagTypeBlocks').querySelectorAll('[data-deltag]').forEach(b => b.addEventListener('click', () => delTag(b.dataset.deltag)));
}
$('#tagSearch').addEventListener('input', renderTagsPage);
function openTagModal(typeName, typeId, row){
  S.editingTag = { typeName, typeId, row };
  $('#tagModalTitle').childNodes[0].textContent = (row?'수정: ':'추가: ') + typeName + ' ';
  $('#tagName').value = row?.label || '';
  $('#tagEmojiField').style.display = typeName === '분류' ? '' : 'none';
  $('#tagEmoji').value = row?.default_emoji || '';
  openOv('ovTag');
  $('#tagName').focus();
}
$('#tagSave').addEventListener('click', async () => {
  const { typeId, row, typeName } = S.editingTag;
  const label = $('#tagName').value.trim();
  if(!label) return toast('이름을 입력하세요', true);
  const payload = { tag_type_id: typeId, label };
  if(typeName === '분류') payload.default_emoji = $('#tagEmoji').value.trim() || null;
  const q = row ? sb.from('tags').update(payload).eq('id', row.id) : sb.from('tags').insert(payload);
  const { error } = await q;
  if(error) return toast('저장 실패: '+error.message, true);
  closeOv('ovTag'); toast('저장됨'); loadAll();
});
window.delTag = async id => {
  if(!confirm('삭제할까요? 부여된 친구에게서도 사라집니다.')) return;
  const { error } = await sb.from('tags').delete().eq('id', id);
  if(error) return toast('삭제 실패: '+error.message, true);
  toast('삭제됨'); loadAll();
};

function renderColorRow(elId, current, onPick){
  $('#'+elId).innerHTML = COLORS.map(c => `<div class="color-sw ${c===current?'on':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  $('#'+elId).querySelectorAll('.color-sw').forEach(sw => sw.addEventListener('click', () => { onPick(sw.dataset.c); renderColorRow(elId, sw.dataset.c, onPick); }));
}

/* =====================================================
   인간관계 시각화 (d3 force)
===================================================== */
let vizSim = null;
function renderViz(){
  const svgEl = d3.select('#vizSvg');
  const wrap = $('#vizWrap');
  const w = wrap.clientWidth, h = 640;
  svgEl.attr('viewBox', [0,0,w,h]);
  svgEl.selectAll('*').remove();

  const nodes = S.friends.map(f => ({ id: f.id, name: f.name, emoji: f.avatar_emoji||'🙂', color: (f.groups[0]?.color) || '#6366f1' }));
  const links = [];
  for(const f of S.friends) for(const r of f.relOut){
    links.push({ source: f.id, target: r.related_friend_id, color: r.type?.color||'#888', label: r.type?.label||'', strength: r.strength||3 });
  }

  if(!nodes.length){
    svgEl.append('text').attr('x', w/2).attr('y', h/2).attr('text-anchor','middle').attr('fill','var(--muted)').text('등록된 친구가 없습니다.');
    return;
  }

  const g = svgEl.append('g');
  svgEl.call(d3.zoom().scaleExtent([0.3,3]).on('zoom', (ev) => g.attr('transform', ev.transform)));

  if(vizSim) vizSim.stop();
  vizSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(110).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collide', d3.forceCollide(34));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d=>d.color).attr('stroke-width', d=>1+d.strength*0.8).attr('stroke-opacity', 0.7);

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor','pointer')
    .call(d3.drag()
      .on('start', (ev,d) => { if(!ev.active) vizSim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
      .on('end', (ev,d) => { if(!ev.active) vizSim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click', (ev,d) => openDetail(d.id));

  node.append('circle').attr('r', 20).attr('fill', 'var(--panel)').attr('stroke', d=>d.color).attr('stroke-width', 3);
  node.append('text').attr('text-anchor','middle').attr('dy','0.32em').attr('font-size','16px').text(d=>d.emoji);
  node.append('text').attr('class','node-label').attr('text-anchor','middle').attr('dy', 34).text(d=>d.name);

  vizSim.on('tick', () => {
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform', d=>`translate(${d.x},${d.y})`);
  });

  const legend = $('#vizLegend');
  legend.innerHTML = `
    <div class="lg-sec"><div class="lg-title">관계유형</div>
      ${S.relTypes.map(t=>`<div class="lg-row"><span class="color-dot" style="background:${esc(t.color||'#666')}"></span>${esc(t.label)}</div>`).join('') || '<div style="color:var(--muted)">없음</div>'}
    </div>
    <div class="lg-sec"><div class="lg-title">무리 (노드 테두리)</div>
      ${S.groups.map(g=>`<div class="lg-row"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}</div>`).join('') || '<div style="color:var(--muted)">없음</div>'}
    </div>`;
}
window.addEventListener('resize', () => { if($('#page-viz').classList.contains('on')) renderViz(); });
